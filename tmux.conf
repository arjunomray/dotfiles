# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# start window and pane numbers at 1
set -g base-index 1
set -g pane-base-index 1

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# resize panes using vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Catppuccin Mocha palette:
# rosewater #f5e0dc  flamingo #f2cdcd  pink #f5c2e7  mauve #cba6f7
# red #f38ba8  maroon #eba0ac  peach #fab387  yellow #f9e2af
# green #a6e3a1  teal #94e2d5  sky #89dceb  sapphire #74c7ec
# blue #89b4fa  lavender #b4befe  text #cdd6f4  subtext1 #bac2de
# subtext0 #a6adc8  overlay2 #9399b2  overlay1 #7f849c  overlay0 #6c7086
# surface2 #585b70  surface1 #45475a  surface0 #313244  base #1e1e2e
# mantle #181825  crust #11111b

# clock mode
setw -g clock-mode-colour '#b4befe'

# copy mode
setw -g mode-keys vi
setw -g mode-style 'fg=#1e1e2e bg=#cba6f7 bold'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# panes
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#b4befe'

# statusbar — dual line (bottom: nav + stats)
set -g status 2
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#cdd6f4 bg=#181825'

# Top bar — session name (left) + git branch (right)
set -g status-left-style 'fg=#1e1e2e bg=#b4befe'
set -g status-left ' #S '
set -g status-left-length 40

set -g status-right-style 'fg=#cdd6f4 bg=#181825'
set -g status-right '#[fg=#313244,bg=#181825]#[fg=#cdd6f4,bg=#313244] ⎇ #(cd #{pane_current_path} && git branch --show-current 2>/dev/null || echo "") '
set -g status-right-length 80

set -g status-interval 5

# Bottom bar — system stats (via status-format[1])
set -g status-format[1] '#[align=right]#[fg=#1e1e2e,bg=#f38ba8] ☀ #(~/dotfiles/scripts/weather.sh) #[fg=#1e1e2e,bg=#a6e3a1] ⚙ #(top -l 1 | grep -E "^CPU" | awk "{print 100 - \$7}")%% #[fg=#1e1e2e,bg=#89dceb] ▤ #(~/dotfiles/scripts/ram_usage.sh) #[fg=#1e1e2e,bg=#cba6f7] ◷ %b/%d '

setw -g window-status-current-style 'fg=#1e1e2e bg=#b4befe'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=#6c7086 bg=#181825'
setw -g window-status-format ' #I #[fg=#cdd6f4]#W #[fg=#b4befe]#F '

setw -g window-status-bell-style 'fg=#1e1e2e bg=#f38ba8 bold'

# messages
set -g message-style 'fg=#1e1e2e bg=#cba6f7 bold'

# terminal + truecolor support
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB,tmux-256color:RGB,screen-256color:RGB'
