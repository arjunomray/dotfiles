# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# start window and pane numbers at 1
set -g base-index 1
set -g pane-base-index 1

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# resize panes using vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour '#c4a7e7'

# copy mode
setw -g mode-keys vi
setw -g mode-style 'fg=#191724 bg=#c4a7e7 bold'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# panes
set -g pane-border-style 'fg=#26233a'
set -g pane-active-border-style 'fg=#c4a7e7'

# statusbar
set -g status-position top
set -g status-justify left
set -g status-style 'fg=#e0def4 bg=#1f1d2e'

set -g status-left-style 'fg=#191724 bg=#c4a7e7'
set -g status-left ' #S #[fg=#c4a7e7,bg=#403d52]#[fg=#e0def4,bg=#403d52]  #(cd #{pane_current_path} && git branch --show-current 2>/dev/null || echo "") '
set -g status-left-length 80

set -g status-right-style 'fg=#e0def4 bg=#1f1d2e'
set -g status-right '#[fg=#191724,bg=#eb6f92] #(~/dotfiles/scripts/weather.sh) #[fg=#191724,bg=#31748f]  #(top -l 1 | grep -E "^CPU" | awk "{print 100 - \$7}")%% #[fg=#191724,bg=#9ccfd8] 󰘚 #(~/dotfiles/scripts/ram_usage.sh) #[fg=#191724,bg=#c4a7e7] 󰃰 %b/%d '
set -g status-right-length 200
set -g status-interval 5

setw -g window-status-current-style 'fg=#191724 bg=#c4a7e7'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=#6e6a86 bg=#1f1d2e'
setw -g window-status-format ' #I #[fg=#e0def4]#W #[fg=#c4a7e7]#F '

setw -g window-status-bell-style 'fg=#191724 bg=#eb6f92 bold'

# messages
set -g message-style 'fg=#191724 bg=#c4a7e7 bold'

# terminal + truecolor support
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB,tmux-256color:RGB,screen-256color:RGB'
