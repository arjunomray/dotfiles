theme = "catppuccin_mocha"

[editor]
line-number = "relative"
mouse = false
soft-wrap.enable = true
auto-format = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[keys.normal]
g = "no_op"

[keys.normal.s]
g = "goto_file_start"
e = "goto_file_end"
d = "goto_definition"
D = "goto_type_definition"
r = "goto_reference"
i = "goto_implementation"
a = "goto_last_accessed_file"
m = "goto_last_modified_file"
n = "goto_next_buffer"
p = "goto_previous_buffer"
"." = "goto_last_change"
